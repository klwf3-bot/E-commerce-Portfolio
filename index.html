<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabetical Recipe Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">RecipeFinder</div>
        <div class="burger-menu" id="burger-menu">
            <span></span><span></span><span></span>
        </div>
        <ul class="nav-links" id="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Favorites</a></li>
            <li><a href="#">About</a></li>
        </ul>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search recipes (e.g., pasta)">
            <button id="search-btn">Search</button>
        </div>
    </nav>

    <main>
        <div id="alphabet-filter" class="alphabet-filter">
            <!-- Populated via JS -->
        </div>
        <div id="loading" class="hidden">Loading recipes...</div>
        <div id="recipe-grid" class="recipe-grid">
            <!-- Recipe cards generated here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Alphabetical Recipe Finder. Powered by Spoonacular API.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
