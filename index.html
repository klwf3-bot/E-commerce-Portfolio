<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabetical Recipe Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Alphabetical Recipe Search</h1>
        <!-- Alphabet Filter Buttons -->
        <div class="alphabet-nav">
            <button class="letter-btn" onclick="fetchRecipesByLetter('A')">A</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('B')">B</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('C')">C</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('D')">D</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('E')">E</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('F')">F</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('G')">G</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('H')">H</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('I')">I</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('J')">J</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('K')">K</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('L')">L</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('M')">M</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('N')">N</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('O')">O</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('P')">P</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('Q')">Q</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('R')">R</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('S')">S</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('T')">T</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('U')">U</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('V')">V</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('W')">W</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('X')">X</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('Y')">Y</button>
            <button class="letter-btn" onclick="fetchRecipesByLetter('Z')">Z</button>
        </div>
        <!-- Search Box -->
        <input type="text" id="search-input" placeholder="Or search by ingredient/keyword...">
        <button onclick="fetchRecipesByKeyword()">Search</button>
    </header>

    <main id="recipe-container" class="recipe-grid">
        <!-- Recipe cards will render here dynamically -->
    </main>

    <footer>
        <p>&copy; 2026 Alphabetical Recipe Finder. Powered by Spoonacular API.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
